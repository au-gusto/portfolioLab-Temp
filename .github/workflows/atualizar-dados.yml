name: Atualizar cotações

# Roda depois do fechamento da B3 (18h BRT), de segunda a sexta.
# 22:00 UTC = 19:00 BRT no horário padrão de Brasília.
#
# Também pode ser disparada à mão pela aba Actions do GitHub — útil para testar
# sem esperar o horário.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

# Sem isto o passo de commit falha: por padrão o token da Action é só leitura.
permissions:
  contents: write

# Duas execuções simultâneas commitariam por cima uma da outra.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # A carteira do IBRX-100 é reavaliada pela B3 a cada quadrimestre. Este
      # passo compara a composição de hoje com o cabeçalho do nosso CSV e sai
      # dizendo "nada a fazer" quando são iguais — o que é o caso em
      # praticamente todos os dias do ano.
      #
      # Quando um papel novo aparece, isso É o sinal de que o índice foi
      # recalculado: quem entrou ganha coluna com histórico desde 2023, quem
      # saiu tem a coluna movida para a base "Outros". O script recusa gravar
      # se algum preço já existente mudar, então rodar todo dia é seguro.
      - name: Sincronizar a carteira do IBRX-100, se a B3 mudou
        run: node scripts/sincronizar-ibrx100.mjs

      - name: Buscar cotações e índices
        run: node scripts/atualizar-dados.mjs

      - name: Conferir se os dados continuam íntegros
        run: node scripts/validar-dados.mjs

      - name: Commitar se algo mudou
        run: |
          if git diff --quiet -- public/Dados; then
            echo "Nada mudou — nenhum pregão novo desde a última execução."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Dados
          git commit -m "dados: cotações até $(date -u +%d/%m/%Y)"
          git push
